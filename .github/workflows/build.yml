name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 requests
      - name: Monthly price check (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          python scripts/verify.py
          git config user.name "price-check-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/verification-log.json data/changelog.json
          git commit -m "Monthly price check $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
