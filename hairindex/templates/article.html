{% extends "base.html" %}
{% block content %}
<div class="narrow">
<p class="eyebrow">Article · {{ a.date|nice_date }}</p>
<h1>{{ a.title }}</h1>
<p class="lede">{{ a.description }}</p>
{{ a.body|safe }}
<p class="muted" style="font-size:.85rem;margin-top:32px">Prices referenced in this article come from the index and were checked {{ checked|nice_date }}. <a href="{{ rel('') }}">See the current ledger</a>.</p>
</div>
{% endblock %}
