{% extends "base.html" %}
{% block content %}
<div class="narrow">
<p class="eyebrow">Articles</p>
<h1>Guides and price notes</h1>
<ul class="plain changelog">
{% for a in articles %}<li><div class="date">{{ a.date|nice_date }}</div><a href="{{ rel('blog/' ~ a.slug ~ '/') }}"><strong>{{ a.title }}</strong></a><p style="margin:.3em 0 0">{{ a.description }}</p></li>{% endfor %}
</ul>
</div>
{% endblock %}
